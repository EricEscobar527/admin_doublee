# Balanceador frente a las réplicas de Django (servicio "admin_doublee").
# Docker resuelve el nombre del servicio a la IP de cada réplica.
upstream django {
    least_conn;
    server admin_doublee:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 5 imágenes de 10 MB + campos de texto
    client_max_body_size 60m;

    # Estáticos directo desde nginx (los genera collectstatic).
    # /media NO se publica: las imágenes de soporte solo se sirven a admins desde Django.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        access_log off;
    }

    # WebSockets del panel (avisos en vivo)
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # uvicorn manda pings cada 20 s, así que la conexión no se corta por inactividad.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host conserva el puerto (necesario para la validación CSRF de Django).
        proxy_set_header Host $http_host;
        # Se sobrescribe (no se concatena) para que el cliente no pueda falsificar su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
