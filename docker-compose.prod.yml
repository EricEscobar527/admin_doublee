# Producción (VPS). Uso: docker compose -f docker-compose.prod.yml up -d --build
# Diferencias con desarrollo: MySQL 8 propio, código dentro de la imagen (sin --reload),
# Caddy con HTTPS automático en lugar de nginx, y datos en volúmenes persistentes.
x-django: &django
  image: ${IMAGEN}
  build: .
  env_file: ${ENV_FILE:-.env}
  restart: unless-stopped
  volumes:
    - media:/home/admin-doublee/media
    - static:/home/admin-doublee/staticfiles

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Mexico_City
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Solo en 127.0.0.1 del VPS (no es accesible desde internet): para entrar con un túnel SSH.
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *django
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"

  admin_doublee:
    <<: *django
    deploy:
      replicas: ${REPLICAS}
      resources:
        limits:
          memory: ${MEMORY}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: gunicorn config.asgi:application -k uvicorn_worker.UvicornWorker --bind 0.0.0.0:8000 --workers ${WORKERS} --timeout 120

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin_doublee

volumes:
  mysql_data:
  media:
  static:
  caddy_data:
  caddy_config:
