{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block body %}
<div class="login-page">
  <form method="post" class="login-card" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="login-brand"><i class="bi bi-phone"></i> DoubleE <span>Admin</span></div>
    <p class="text-muted mb-4">Administración de aplicaciones móviles</p>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <div class="mb-3">
      <label class="form-label" for="username">Usuario</label>
      <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Contraseña</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary w-100">Entrar</button>
  </form>
</div>
{% endblock %}
