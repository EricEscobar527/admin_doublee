<a href="{% url 'support:detail' ticket.pk %}" data-ticket-id="{{ ticket.pk }}" class="list-group-item list-group-item-action latest-item">
  <span class="li-folio text-muted small mono">{{ ticket.folio }}</span>
  <span class="li-app">{% include "applications/_badge.html" with application=ticket.application %}</span>
  <span class="li-text text-truncate">{{ ticket.get_issue_display }} · {{ ticket.email }}</span>
  <span class="li-status">{% include "support/_status_badge.html" %}</span>
  <span class="li-date text-muted small">{{ ticket.created_at|date:"d/m H:i" }}</span>
</a>
